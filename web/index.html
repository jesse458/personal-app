<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101010">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Personal">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<title>Personal App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, personal, efficient — a daybook you open every morning.
   IDEA: a pocket planner: a deep cover band with today's date and weather, tabbed pages inside.
   PICTURE: the Home page itself — agenda with large hanging times, cards for birthdays, gifts, bills.
   COLOUR and TYPE: near-black cover, white pages (inverted in dark), red only for overdue. Syne headings + Space Grotesk text.
   LAYOUT: cover band, sticky tab row, sub-tabs per section, one column that becomes a two-up grid on wide screens. */
:root{color-scheme:light dark;
--page:light-dark(#f3f3f3,#0b0b0b);--ink:light-dark(#111111,#f2f2f2);--mute:light-dark(#666666,#9a9a9a);
--line:light-dark(#e2e2e2,#2a2a2a);--cover:#1b1b1b;--cover2:#101010;--gold:var(--ink);--coral:#d9534f;--ok:var(--ink);--card:light-dark(#ffffff,#161616);--soft:light-dark(#f3f3f3,#1f1f1f);--hl:var(--ink)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.5 "Space Grotesk",system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
.cover{background:linear-gradient(160deg,var(--cover),var(--cover2));color:#f2f2f2;padding:calc(clamp(20px,4vw,40px) + env(safe-area-inset-top)) max(5vw,16px,env(safe-area-inset-right)) 18px max(5vw,16px,env(safe-area-inset-left))}
.wrap{max-width:1240px;margin:auto}
.top{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between}
.date{letter-spacing:-.02em;font-weight:800;font:800 clamp(34px,5.6vw,56px)/1.02 "Syne",system-ui,sans-serif;margin:0;text-wrap:balance}
.hello{color:#bdbdbd;margin:6px 0 0}
.wx{display:flex;gap:14px;align-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 16px;max-width:420px}
.wx{color:inherit;font:inherit;text-align:left;cursor:pointer}.wx:hover{background:rgba(255,255,255,.12)}.wx svg{flex:none}
.wxp{margin-top:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:16px}
.wxp h4{margin:14px 0 8px;font-size:14px;color:#bdbdbd;font-weight:600}.wxp h4:first-child{margin-top:0}
.hrs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}.hrs .h{flex:none;width:68px;text-align:center;background:rgba(255,255,255,.06);border-radius:12px;padding:8px 4px;font-size:13px}.hrs .h b{display:block;font-size:17px}.hrs .h small{color:#cfcfcf}
.dl{list-style:none;margin:0;padding:0}.dl li{display:grid;grid-template-columns:92px 30px minmax(0,1fr) 44px 72px;gap:8px;align-items:center;padding:7px 0;border-top:1px solid rgba(255,255,255,.1);font-size:14px}.dl li:first-child{border-top:0}.dl .r{text-align:right;white-space:nowrap}.dl small{color:#cfcfcf}
.wxd{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.wxd div{background:rgba(255,255,255,.06);border-radius:10px;padding:8px 10px;font-size:13px;color:#bdbdbd}.wxd b{display:block;color:#fff;font-size:16px}
.alert{background:rgba(224,87,62,.25);border-radius:10px;padding:8px 12px;margin-bottom:6px;font-size:14px}
@media(max-width:600px){.dl li{grid-template-columns:70px 26px minmax(0,1fr) 64px}.dl li .pp{display:none}}.wx .t{font:700 32px/1 "Syne",system-ui,sans-serif}.wx small{display:block;color:#bdbdbd;font-size:13px}
.bars{margin-top:18px}
.bars input{width:100%;padding:12px 16px;border-radius:12px;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:16px;min-height:46px}
.bars input::placeholder{color:#9a9a9a}
.bars form{display:flex;gap:8px}
.aiwrap{margin-top:10px}.aiwrap .ai{background:rgba(255,255,255,.08);color:#f2f2f2;border-left-color:#fff}
.status{font-size:13px;color:#9a9a9a;margin-top:8px}
nav{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.scroll{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav .scroll{padding:8px max(5vw,16px);max-width:1240px;margin:auto}
nav a{flex:none;padding:10px 14px;border-radius:10px;text-decoration:none;color:var(--mute);font-weight:500;min-height:44px;display:flex;align-items:center}
nav a.on{background:var(--ink);color:var(--card)}
.subs{margin:0 0 18px;gap:6px}
.subs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 16px;min-height:40px;cursor:pointer;color:var(--mute);font-weight:500}
.subs button.on{background:var(--ink);color:var(--card);border-color:transparent}
main{max-width:1240px;margin:auto;padding:24px max(5vw,16px) 80px}
h2{letter-spacing:-.02em;font:800 32px/1.05 "Syne",system-ui,sans-serif;margin:0 0 4px}
h3{font-size:17px;letter-spacing:-.01em;margin:0 0 10px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
h3 small{font-weight:400;color:var(--mute);font-size:14px}
.sub{color:var(--mute);margin:0 0 16px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));align-items:start}
.full{grid-column:1/-1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.card+.card{margin-top:18px}.grid .card+.card{margin-top:0}
.banner{background:var(--ink);color:var(--card);border:0}
.banner .meta{color:inherit;opacity:.75}
.list{list-style:none;margin:0;padding:0}
.list>li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.list>li:first-child{border-top:0}
.when{flex:none;width:72px;font:700 17px/1.1 "Syne",system-ui,sans-serif;color:var(--hl)}
.when small{display:block;font:12px/1.3 "Space Grotesk";color:var(--mute);margin-top:3px}
.grow{flex:1}.meta{color:var(--mute);font-size:14px}
.late{color:var(--coral)!important;font-weight:600}
.pill{display:inline-block;font-size:13px;padding:1px 8px;border-radius:99px;background:var(--soft);border:1px solid var(--line);margin-left:4px;white-space:nowrap;font-weight:400}
.pill.hi{background:var(--coral);color:#fff;border-color:transparent}
.btn{border:0;border-radius:10px;padding:10px 16px;min-height:44px;background:var(--ink);color:var(--card);font-weight:600;cursor:pointer;white-space:nowrap}
.btn.gold{background:var(--ink);color:var(--card)}.cover .btn.gold{background:#fff;color:#111}.btn.ghost{background:transparent;color:inherit;border:1px solid var(--line)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ic{border:0;background:none;cursor:pointer;color:var(--mute);min-width:36px;min-height:36px;border-radius:8px;font-size:14px;flex:none}
.ic:hover{background:var(--soft);color:var(--ink)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.chk{flex:none;width:26px;height:26px;margin-top:1px;accent-color:var(--ink);cursor:pointer}
.done>.grow>b{text-decoration:line-through;color:var(--mute)}
form.add{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end;margin-bottom:18px}
label.f{font-size:13px;color:var(--mute);display:grid;gap:4px}
.inp,form.add input:not([type=checkbox]),form.add select,form.add textarea{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:16px;min-height:44px;width:100%}
textarea{resize:vertical;min-height:80px}
.bar{height:10px;border-radius:99px;background:var(--soft);border:1px solid var(--line);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .4s}
.bar i.over{background:var(--coral)}
.big{letter-spacing:-.02em;font:700 42px/1 "Syne",system-ui,sans-serif}
.empty{color:var(--mute);font-style:italic;padding:8px 0}
.ai{border-left:3px solid var(--gold);padding:10px 14px;background:var(--soft);border-radius:0 10px 10px 0;white-space:pre-wrap;margin-top:12px;font-size:15px}
.steps{list-style:none;padding:6px 0 0;margin:0}.steps li{padding:3px 0;font-size:15px}
.mfp{display:grid;grid-template-columns:repeat(5,auto);gap:4px 10px;align-items:end;text-align:center;justify-content:start}
.mfp div{display:grid}.mfp b{font:700 28px/1 "Syne",system-ui,sans-serif;font-weight:400}.mfp span{font-size:12px;color:var(--mute)}
.mfp i{font-style:normal;color:var(--mute);font-size:22px;padding-bottom:14px}
.meal h3{border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:0}
.inl{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:8px;margin-top:10px}
.dots{display:flex;gap:4px;margin-top:6px}.dots i{width:14px;height:14px;border-radius:4px;background:var(--soft);border:1px solid var(--line)}.dots i.y{background:var(--ok);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px dashed var(--line);background:var(--card);border-radius:99px;padding:8px 14px;cursor:pointer;min-height:40px}
.chip.fav{border-style:solid}
.plan td,.plan th{padding:6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.plan select{width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);min-height:40px}
table{border-collapse:collapse;width:100%}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
a.lnk{color:var(--hl);font-weight:600}
.note{display:none;font-size:13px;color:var(--mute);margin-top:10px}
.day{border-top:1px solid var(--line)}.day:first-child{border-top:0}.day summary{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 2px;cursor:pointer;min-height:48px;list-style:none}.day summary::-webkit-details-marker{display:none}.day summary::before{content:'›';color:var(--mute);margin-right:8px;transition:transform .2s}.day[open] summary::before{transform:rotate(90deg)}.day summary>span:first-child{flex:1}.day .list{padding:0 0 10px 22px}.okc{color:var(--ok);font-weight:600}
.subs2 .subs button{min-height:36px;padding:6px 14px;font-size:14px;border-radius:10px}
.calbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:12px}
.calwrap{max-height:270px;overflow:auto;border:1px solid var(--line);border-radius:12px;overscroll-behavior:contain}.calwrap .cal.wk{min-width:640px}.calwrap .cal{border-top:0}
.chead{position:sticky;top:0;z-index:3;background:var(--card)}
.cal{display:grid;column-gap:0;border-top:1px solid var(--line)}
.chead{text-align:center;padding:6px 0;cursor:pointer;border-bottom:1px solid var(--line)}.chead span{display:block;font-size:12px;color:var(--mute)}.chead b{font:700 20px/1.2 "Syne",system-ui,sans-serif;font-weight:400}.chead.now b{background:var(--ink);color:var(--card);border-radius:99px;padding:0 8px}
.allday{padding:4px 2px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);display:grid;gap:3px;align-content:start}
.tlab{font-size:11px;color:var(--mute);text-align:right;padding-right:6px}
.tcol{position:relative}.tcol span{position:absolute;right:6px;transform:translateY(-50%);font-size:11px;color:var(--mute);white-space:nowrap}
.dcol{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px)}
.ev{position:absolute;display:block;overflow:hidden;background:var(--ink);color:var(--card);border-radius:5px;padding:2px 6px;font-size:12px;line-height:1.2;text-decoration:none}
.ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ev span{display:block;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.app{background:var(--soft);color:var(--ink);border:1px solid var(--ink)}
.ev.ad{position:static;padding:2px 6px}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--coral);z-index:2}.nowline::before{content:'';position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--coral)}
.modalwrap{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:20px}.modalwrap[hidden]{display:none}
.modal{background:var(--card);color:var(--ink);border-radius:16px;padding:20px;width:min(380px,100%);box-shadow:0 20px 50px rgba(0,0,0,.35)}.modal p{margin:0 0 16px;font-size:17px}
.btn.danger{background:var(--coral);color:#fff}
.undobtn{position:fixed;left:max(18px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));z-index:8;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:10px 16px;min-height:44px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer}
.copyrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:8px;align-items:center;margin-bottom:8px}.copyrow code{font-size:12px;background:var(--soft);padding:8px;border-radius:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.copyrow span{font-size:13px;color:var(--mute)}
.howto{padding-left:20px;margin:12px 0 0;font-size:14px;line-height:1.55}.howto li{margin-bottom:6px}
.stepcard .big{font-size:38px}.sbars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:90px;margin-top:14px;align-items:end}.sbars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}.sbars i{display:block;width:100%;max-width:26px;background:var(--line);border-radius:5px}.sbars div.on i{background:var(--ink)}.sbars span{font-size:11px;color:var(--mute)}
.bnav,.sheet{display:none}
button.card.tap{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}button.card.tap:active{transform:scale(.99)}
.sbars.s7{height:130px;position:relative}.sbars.s7 b{font-size:11px;font-weight:600;color:var(--mute)}.sbars.s7 div.on b{color:var(--ink)}.sbars.s7 div.hit i{background:var(--ink)}.sbars.s7 div.on i{background:var(--ink)}.sbars.s7 i{max-width:32px}.goalline{display:none}
html{-webkit-tap-highlight-color:transparent}button,a,summary,.chip,nav{touch-action:manipulation;-webkit-user-select:none;user-select:none}
@media (max-width:760px){
 body{overscroll-behavior-y:none}
 .topnav{display:none}
 .cover{padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:12px}
 .date{font-size:28px}.hello{font-size:14px;margin-top:2px}
 .top{gap:10px}.wx{max-width:none;width:100%;padding:10px 12px}.wx .t{font-size:26px}.wx svg{width:34px;height:34px}
 .bars{margin-top:10px}.bars input{min-height:42px}
 body:not(.t-home) .cover .top{display:none}body:not(.t-home) .cover{padding-top:calc(10px + env(safe-area-inset-top))}
 body:not(.t-home) .wxp{display:none}
 main{padding:16px 12px calc(96px + env(safe-area-inset-bottom))}
 h2{font-size:26px}.sub{font-size:14px;margin-bottom:12px}
 .card{padding:14px;border-radius:14px}.grid{gap:12px}
 form.add{grid-template-columns:repeat(2,minmax(0,1fr))}form.add>div:last-child{grid-column:1/-1}form.add>div:last-child .btn{width:100%}
 .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;border-bottom:0;z-index:12;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:saturate(1.5) blur(14px);-webkit-backdrop-filter:saturate(1.5) blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .bnav a,.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;min-height:50px;color:var(--mute);text-decoration:none;font:600 11px "Space Grotesk",sans-serif;background:none;border:0}
 .bnav a.on,.bnav button.on{color:var(--ink);background:none}.bnav a{border-radius:0;justify-content:center;flex:none}.bnav svg{width:24px;height:24px}
 .sheet{display:block;position:fixed;left:8px;right:8px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:13;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px;box-shadow:0 18px 40px rgba(0,0,0,.25)}
 .sheet[hidden]{display:none}.sheet a{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:600}.sheet a.on{background:var(--soft)}.sheet svg{width:22px;height:22px}
 .mic{bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px}.vpanel{bottom:calc(144px + env(safe-area-inset-bottom))}
 .undobtn{bottom:calc(84px + env(safe-area-inset-bottom))}
 .toast{bottom:calc(150px + env(safe-area-inset-bottom))}
 .calwrap{max-height:240px}
 .calbar{flex-wrap:nowrap;align-items:flex-end;gap:8px}.calbar>.row{flex-wrap:wrap;gap:6px}.calbar>.row>b{flex-basis:100%;order:-1;margin:0 0 2px!important;font-size:15px}.calbar .btn.sm{min-height:36px;padding:4px 10px}.calbar .subs{flex:none;overflow:visible}.calbar .subs button{min-height:36px;padding:4px 12px}
}
@media (display-mode:standalone){body{-webkit-user-select:none;user-select:none}input,textarea,[contenteditable],code,.ai,pre{-webkit-user-select:text;user-select:text}}
.mic{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:8;width:64px;height:64px;border-radius:50%;border:0;background:var(--ink);color:var(--card);box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;display:grid;place-items:center}
.mic.on{background:var(--coral);color:#fff;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(224,87,62,.25)}}
.vpanel{position:fixed;right:18px;bottom:96px;z-index:8;width:min(360px,calc(100vw - 36px));background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.vpanel b{display:block;margin-bottom:4px}.vpanel p{margin:0;min-height:24px}
main{padding-bottom:120px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:600px){.bars{grid-template-columns:1fr}.when{width:56px;font-size:18px}h2{font-size:30px}.inl{grid-template-columns:minmax(0,1fr) 84px}.inl .btn{grid-column:1/-1}
 .plan thead{display:none}.plan tr{display:grid;grid-template-columns:1fr 1fr 1fr;padding:8px 0;border-bottom:1px solid var(--line)}.plan th{grid-column:1/-1;border:0}.plan td{border:0}}
</style>
</head>
<body>
<header class="cover">
 <div class="wrap">
  <div class="top">
   <div><p class="date" id="date">Today</p><p class="hello" id="hello">Hello.</p></div>
   <button class="wx" id="wx" aria-expanded="false" aria-controls="wxp"></button>
  </div>
  <div id="wxp" class="wxp" hidden></div>
  <div class="bars">
   <form id="askf"><input id="askq" placeholder="AI assistant" aria-label="AI assistant"><button class="btn gold">Go</button></form>
  </div>
  <div class="aiwrap"><div class="ai" data-ai="ask" hidden></div></div>
  <div class="status" id="status"></div>
 </div>
</header>
<nav class="topnav"><div class="scroll" id="tabs"></div></nav>
<main id="main"></main>
<nav class="bnav" id="bnav" aria-label="Sections"></nav>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" role="status"></div>
<div class="modalwrap" id="modal" hidden><div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="mq"><p id="mq"></p><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-n>Cancel</button><button class="btn danger" data-y>Delete</button></div></div></div>
<button class="undobtn" id="undoBtn" hidden aria-label="Undo last change">↶ Undo</button>

/* ---------- dates & occasions ---------- */
function nextYearly(m,d){const n=new Date(),y=n.getFullYear();let x=new Date(y,m,+d);if(ymd(x)<today())x=new Date(y+1,m,+d);return ymd(x)}
const nextBday=p=>nextYearly(MONTHS.indexOf(p.month),p.day);
function nth(y,m,wd,n){if(n>0){const d=new Date(y,m,1);d.setDate(1+((wd-d.getDay()+7)%7)+7*(n-1));return d}const d=new Date(y,m+1,0);d.setDate(d.getDate()-((d.getDay()-wd+7)%7));return d}
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
function holidays(){const out=[];const y0=new Date().getFullYear();for(const y of[y0,y0+1]){[["New Year's Day",new Date(y,0,1)],["Valentine's Day",new Date(y,1,14)],['Easter',easter(y)],["Mother's Day",nth(y,4,0,2)],['Memorial Day',nth(y,4,1,-1)],["Father's Day",nth(y,5,0,3)],['Independence Day',new Date(y,6,4)],['Halloween',new Date(y,9,31)],['Thanksgiving',nth(y,10,4,4)],['Christmas Eve',new Date(y,11,24)],['Christmas',new Date(y,11,25)],["New Year's Eve",new Date(y,11,31)]].forEach(([t,d])=>{const s=ymd(d);if(s>=today())out.push({t,date:s})})}return out.sort((a,b)=>a.date>b.date?1:-1)}
const holiday=t=>holidays().find(h=>h.t===t);
function billDue(b){const n=new Date(),y=n.getFullYear(),m=n.getMonth();const mk=(y,m)=>new Date(y,m,Math.min(+b.day,new Date(y,m+1,0).getDate()));let d=mk(y,m),off=0;if(ymd(d)<today()){d=mk(y,m+1);off=1}const cur=ymd(d).slice(0,7),paid=b.paid===cur;if(paid)d=mk(y,m+1+off);return{date:ymd(d),paid,cur}}
function subNext(s){let d=s.next||today();let g=0;while(d<today()&&g++<500)d=s.cycle==='Yearly'?addD(d,0).replace(/^\d{4}/,y=>+y+1):(()=>{const x=pd(d);x.setMonth(x.getMonth()+1);return ymd(x)})();return d}
function advance(w,r){const d=new Date(w);if(r==='Daily')d.setDate(d.getDate()+1);else if(r==='Weekly')d.setDate(d.getDate()+7);else if(r==='Monthly')d.setMonth(d.getMonth()+1);else if(r==='Yearly')d.setFullYear(d.getFullYear()+1);return ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}
const weekStart=(off=0)=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7)+7*off);return ymd(d)};
function occasionsFor(p){const o=[{t:'Christmas',date:holiday('Christmas').date}];if(!p.nobday)o.push({t:p.name+'’s birthday',date:nextBday(p)});const r=(p.rel||'').toLowerCase();
 if(/mom|mother/.test(r))o.push({t:"Mother's Day",date:holiday("Mother's Day").date});if(/dad|father/.test(r))o.push({t:"Father's Day",date:holiday("Father's Day").date});

 return o.sort((a,b)=>a.date>b.date?1:-1)}

function upcoming(n){const out=[],lim=addD(today(),n);

/* ---------- storage ---------- */
const dirty=new Set();let saveT;
let undoStack=[],lastSaved={},noUndo=false;

function save(k){if(!noUndo&&!NOUNDO.has(k)){const last=undoStack[undoStack.length-1];if(!(last&&last.k===k&&Date.now()-last.t<60))undoStack.push({k,before:clone(lastSaved[k]),t:Date.now()});else last.t=Date.now();if(undoStack.length>40)undoStack.shift();paintUndo()}lastSaved[k]=clone(S[k]);dirty.add(k);try{localStorage.setItem('pa2',JSON.stringify(S))}catch(e){}clearTimeout(saveT);saveT=setTimeout(flush,700)}
async function flush(){if(!db)return dirty.clear();const ks=[...dirty];dirty.clear();for(const k of ks){if(k==='weather')continue;try{await db.doc('app/'+k).set({items:S[k],at:Date.now()})}catch(e){dirty.add(k);setStatus('Couldn’t save just now — will retry with your next change.')}}}
const setStatus=t=>{$('#status').textContent=t};
function unwrap(r){const v0=unwrap0(r);return v0===undefined||v0===null?v0:JSON.parse(JSON.stringify(v0))}
function unwrap0(r){let v=r;if(v&&typeof v.data==='function')v=v.data();if(v&&v.data&&v.data.items!==undefined)v=v.data;return v&&v.items!==undefined?v.items:undefined}
function migrate(o){if(!o)return;const st=S.settings.stores[0];
 ['todos','reminders','people','bills','workouts'].forEach(k=>{if(Array.isArray(o[k])&&!S[k].length)S[k]=o[k]});
 if(o.goals&&!S.goals.length)S.goals=o.goals.map(g=>({...g,horizon:'Annual',period:String(new Date().getFullYear())}));
 if(o.meals&&!S.food.length)S.food=o.meals.map(m=>({id:m.id,date:m.date,meal:m.meal==='Snack'?'Snacks':m.meal,name:m.what,kcal:m.kcal}));
 if(o.groceries&&!S.shop.length)S.shop=o.groceries.map(g=>({id:g.id,store:st,name:g.name+(g.qty?' ('+g.qty+')':''),kind:g.cat==='Household'?'Household':'Groceries',on:true,got:!!g.got}));
 if(o.settings){if(o.settings.name)S.settings.name=o.settings.name;if(o.settings.wmin)S.settings.wmin=o.settings.wmin}}
async function load(){
 let local=null;try{local=JSON.parse(localStorage.getItem('pa2')||'null')}catch(e){}
 if(local)Object.assign(S,local);else{try{migrate(JSON.parse(localStorage.getItem('pa-state')||'null'))}catch(e){}}
 snapAll();render();
 claude.use('sample').then(s=>{sample=s;if(s)render()}).catch(()=>{});
 claude.use('mcp').then(m=>{mcp=m;render();initWx();watchCal();watchStrava()}).catch(()=>{});
 let lastDay=today();setInterval(()=>{if(today()!==lastDay){if(calDate===lastDay)calDate=today();lastDay=today();watchCal()}if(tab==='home'&&!document.querySelector('form :focus'))render()},300000);
 const timer=setTimeout(()=>setStatus('Saved on this device only — couldn’t reach your account storage.'),10000);
 try{
  db=await claude.use('db');
  if(!db){clearTimeout(timer);setStatus('Saved on this device only. Open it signed in to sync.');return}
  const keys=[...LISTS,...OBJS];
  const vals=await Promise.all(keys.map(k=>db.doc('app/'+k).get().then(unwrap).catch(()=>undefined)));
  clearTimeout(timer);let any=false;
  keys.forEach((k,i)=>{if(vals[i]!==undefined&&vals[i]!==null){S[k]=k==='settings'?{...S.settings,...vals[i]}:vals[i];any=true}});
  if(!any){try{const user=await claude.use('user');const u=user&&await user.id();if(u){const old={};for(const k of['settings','todos','reminders','people','bills','goals','workouts','meals','groceries']){old[k]=await db.doc('data/users/'+u+'/'+k).get().then(unwrap).catch(()=>undefined)}migrate(old)}}catch(e){}
   keys.forEach(k=>{if(k!=='weather')dirty.add(k)});flush()}
  setStatus('');snapAll();spawn();render();initWx();
  try{db.doc('app/steps').onSnapshot(s=>{const v=unwrap(s);if(v){S.steps=v;lastSaved.steps=clone(v);if(tab==='home'||tab==='health')render()}})}catch(e){}
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&db)db.doc('app/steps').get().then(unwrap).then(v=>{if(v){S.steps=v;lastSaved.steps=clone(v);render()}}).catch(()=>{})});
  try{db.doc('app/weather').onSnapshot(s=>{const w=unwrap(s);if(w){S.weather=w;paintWx()}})}catch(e){}
 }catch(e){clearTimeout(timer);setStatus('Saved on this device only — sync is unavailable right now.')}
}

/* ---------- appointments ---------- */
function spawn(){let ch=false;S.appts.forEach(a=>{const m=REPS[a.repeat];if(a.status!=='Needs scheduling'&&a.date&&a.date<today()&&m&&!a.spawned){const d=pd(a.date);d.setMonth(d.getMonth()+m);S.appts.push({id:uid(),title:a.title,cat:a.cat,status:'Needs scheduling',by:ymd(d),last:a.date,repeat:a.repeat,notes:a.notes||'',where:a.where||''});a.spawned=true;ch=true}});if(ch)save('appts')}
async function sendCal(a){if(await addToCal(a)){a.oncal=true;save('appts');render()}}
/* ---------- Google Calendar (write only) ---------- */
const localIso=d=>ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':00';
function payload(r){let p=r&&r.payload!==undefined?r.payload:r;if(p&&p.structuredContent)p=p.structuredContent;if(p&&Array.isArray(p.content)){const t=p.content.find(c=>c.type==='text');p=t?t.text:p}if(typeof p==='string'){try{p=JSON.parse(p)}catch(e){}}return p}
let calScrollKey='',calScrollPos=0,calView='Day',calDate=today(),calWeek='',calH=null;
const weekOf=d=>{const x=pd(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return ymd(x)};
let calOk=false;async function watchCal(force){if(!mcp)return;const ws=weekOf(calDate);if(ws===calWeek&&!force)return;try{typeof calH==='function'?calH():calH&&calH.unsubscribe&&calH.unsubscribe()}catch(e){}calWeek=ws;cal=null;const s=pd(ws),e=pd(addD(ws,7));const inp={startTime:localIso(s),endTime:localIso(e),orderBy:'startTime',pageSize:250};
 if(!calOk){try{const p=payload(await mcp.callTool('Google Calendar','list_events',inp));cal=(p&&p.events)||[];calOk=true;calErr='';if(tab==='home')render()}catch(err){calErr=mcpMsg(err,'Google Calendar');calWeek='';if(tab==='home')render();return}}
 try{calH=mcp.watchTool('Google Calendar','list_events',inp,ev=>{
  if(ev.type==='data'){const p=payload(ev.result);cal=(p&&p.events)||[];calErr='';if(tab==='home')render()}else if(ev.type==='error'&&!cal){calErr=mcpMsg(ev.error,'Google Calendar');if(tab==='home')render()}},{refetchInterval:600000})}catch(err){calErr={t:'Calendar unavailable right now.'}}}
const mins=s=>{const t=String(s).slice(11,16).split(':');return(+t[0])*60+(+t[1]||0)};
function calItems(d){const all=[],timed=[];
 (cal||[]).forEach(e=>{if(e.status==='cancelled')return;const s=e.start||{},en=e.end||{};const link=String(e.htmlLink||'').startsWith('https://')?e.htmlLink:'';
  if(s.date){if(d>=s.date&&d<(en.date||addD(s.date,1)))all.push({t:e.summary||'(busy)',link})}
  else if(s.dateTime){const sd=s.dateTime.slice(0,10),ed=(en.dateTime||s.dateTime).slice(0,10);if(d<sd||d>ed)return;const a=sd===d?mins(s.dateTime):0,b=ed===d?mins(en.dateTime||s.dateTime):1440;timed.push({t:e.summary||'(busy)',a,b:Math.max(b,a+15),w:e.location||'',link,tm:sd===d?tm(s.dateTime):''})}});
 S.appts.forEach(x=>{if(x.status==='Needs scheduling'||x.date!==d)return;if(x.oncal&&(cal||[]).some(e=>(e.summary||'')===x.title))return;if(x.time){const a=mins('0000-00-00T'+x.time);timed.push({t:x.title,a,b:a+60,w:x.where||'',tm:tm(d+'T'+x.time),app:1})}else all.push({t:x.title,app:1})});
 S.people.forEach(p=>{if(!p.nobday&&nextBday(p)===d)all.push({t:p.name+'’s birthday'})});
 timed.sort((x,y)=>x.a-y.a||y.b-x.b);let lanes=[],grp=[],gEnd=0;const flush=()=>{grp.forEach(x=>x.n=lanes.length);lanes=[];grp=[]};
 timed.forEach(x=>{if(grp.length&&x.a>=gEnd)flush();let i=lanes.findIndex(e=>e<=x.a);if(i<0){i=lanes.length;lanes.push(0)}lanes[i]=x.b;x.l=i;grp.push(x);gEnd=Math.max(gEnd,x.b)});flush();
 return{all,timed}}
function calendarHTML(){const days=calView==='Week'?[...Array(7)].map((_,i)=>addD(weekOf(calDate),i)):[calDate],data=days.map(calItems);
 let h0=7,h1=21;data.forEach(x=>x.timed.forEach(e=>{h0=Math.min(h0,Math.floor(e.a/60));h1=Math.max(h1,Math.ceil(e.b/60))}));h1=Math.min(24,h1);const H=30,top=h0*60;let st=0;{const n=new Date(),m=n.getHours()*60+n.getMinutes();const first=data.reduce((a,z)=>Math.min(a,...z.timed.map(e=>e.a)),1440);const focus=days.includes(today())?m-60:first<1440?first-30:8*60;st=Math.max(0,(focus-top)/60*H)}
 const label=calView==='Week'?fmtD(days[0])+' – '+fmtD(days[6]):(calDate===today()?'Today · ':'')+WD[pd(calDate).getDay()]+', '+fmtD(calDate);
 let x='<div class="calbar"><div class="row"><button class="btn ghost sm" data-act="cnav" data-d="-1" aria-label="Previous">‹</button><button class="btn ghost sm" data-act="ctoday">Today</button><button class="btn ghost sm" data-act="cnav" data-d="1" aria-label="Next">›</button><b style="margin-left:6px">'+esc(label)+'</b></div><div class="scroll subs" style="margin:0">'+['Day','Week'].map(v=>'<button data-act="cview" data-v="'+v+'" class="'+(calView===v?'on':'')+'">'+v+'</button>').join('')+'</div></div>';
 x+='<div class="calwrap" id="calwrap" data-k="'+calView+calDate+'" data-st="'+st+'"><div class="cal'+(calView==='Week'?' wk':'')+'" style="grid-template-columns:48px repeat('+days.length+',minmax(0,1fr))">';
 if(calView==='Week'){x+='<div class="chead"></div>'+days.map(d=>'<div class="chead'+(d===today()?' now':'')+'" data-act="cday" data-d="'+d+'"><span>'+WD[pd(d).getDay()].slice(0,3)+'</span><b>'+pd(d).getDate()+'</b></div>').join('')}

$('#wx').addEventListener('click',()=>{wxOpen=!wxOpen;paintWx()});
$('#wxp').addEventListener('click',e=>{if(e.target.id==='wxallow')initWx(true);if(e.target.id==='wxhere'){S.settings.city='Current location';S.settings.wxKeyFor='';save('settings');initWx(true);toast('Weather follows your location')}});
document.addEventListener('submit',e=>{if(e.target.id!=='wxcity')return;e.preventDefault();e.stopImmediatePropagation();const c=e.target.c.value.trim();if(c){S.settings.city=c;save('settings');initWx();toast('Weather set to '+c)}},true);
addEventListener('hashchange',()=>{moreOpen=false;const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)){if(tab==='notes'&&h!=='notes'&&V)vLock();tab=h;editing=null;query='';render();scrollTo(0,0)}});
if(/connected=/.test(location.search)){setTimeout(()=>toast('Connected'),800);history.replaceState(null,'',location.pathname+'#settings');tab='settings'}
load();
}
</script>
</body>
</html>
